<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>Add movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>

<body>
<div class="container">
    <div sec:authorize="isAuthenticated()" class="d-flex flex-row-reverse pb-3 mb-4">
        <div class="p-2 pb-3 mb-4">
            <span>
                User:
                <b><span sec:authentication="name"></span></b>
            </span>
        </div>
        <form th:action="@{/logout}"
              method="post"
              style="display:inline; margin-left:10px">
            <input type="hidden" name="${_csrf.parameterName}"/>
            <button type="submit" class="btn-subtle theme-accent">Logout</button>
        </form>
    </div>
    <h1>Add new movies</h1>
    <form th:action="@{/admin/add}" th:object="${newMovie}" method="post">
        <label>Name</label>
        <input type="text" th:field="*{name}" placeholder="Name">
        <br><br>
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              style="color:red"></span>
        <br><br>

        <label>Year</label>
        <input type="number" th:field="*{year}" placeholder="Year">
        <br><br>
        <span th:if="${#fields.hasErrors('year')}"
              th:errors="*{year}"
              style="color:red"></span>
        <br><br>

        <label>Director</label>
        <input type="text" th:field="*{director}" placeholder="Director">
        <br><br>
        <span th:if="${#fields.hasErrors('director')}"
              th:errors="*{director}"
              style="color:red"></span>
        <br><br>

        <a th:href="@{/admin}" class="btn-outline theme-accent">
            Go back
        </a>
        <button type="submit" class="theme-accent btn-solid btn-styled">Add</button>


    </form>
</div>
</body>
