<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>Edit user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>

<body>
<div class="container">
    <div sec:authorize="isAuthenticated()" class="d-flex flex-row-reverse pb-3 mb-4">
        <div class="p-2 pb-3 mb-4">
            <span>
                User:
                <b><span sec:authentication="name"></span></b>
            </span>
        </div>
        <form th:action="@{/logout}"
              method="post"
              style="display:inline; margin-left:10px">
            <input type="hidden" name="${_csrf.parameterName}"/>
            <button type="submit" class="btn-subtle theme-accent">Logout</button>
        </form>
    </div>
<h1>Edit user</h1>
<form th:action="@{/admin/users/edit}" th:object="${editUser}" method="post">
    <label>Username</label>
    <input type="text" th:field="*{username}" placeholder="Name">
    <br><br>
    <span th:if="${#fields.hasErrors('username')}"
          th:errors="*{username}"
          style="color:red"></span>
    <br><br>

    <label>Password</label>
    <input type="password" th:field="*{password}" placeholder="Password">
    <br><br>
    <span th:if="${#fields.hasErrors('password')}"
          th:errors="*{password}"
          style="color:red"></span>
    <br><br>

    <label>Email</label>
    <input type="email" th:field="*{email}" placeholder="Email">
    <br><br>
    <span th:if="${#fields.hasErrors('email')}"
          th:errors="*{email}"
          style="color:red"></span>
    <br><br>

    <div>
        <label>Roles:</label>
        <div th:each="role : ${allRoles}">
            <label>
                <input type="checkbox"
                       th:field="*{selectedRoleIds}"
                       th:value="${role.id}">

                <span th:text="${role.role}"></span>
            </label>
        </div>
    </div>

    <a th:href="@{/admin/users}" class="btn-outline theme-accent">
        Go back
    </a>
    <button type="submit" class="btn-solid theme-accent">Edit</button>

</form>
</div>
</body>
