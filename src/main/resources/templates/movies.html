<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>Movies</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">

</head>

<body>
    <div class="container" >
        <div sec:authorize="isAuthenticated()" class="d-flex flex-row-reverse pb-3 mb-4">
            <div class="p-2 pb-3 mb-4">
            <span>
                User:
                <b><span sec:authentication="name"></span></b>
            </span>
            </div>
            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline; margin-left:10px">
                <input type="hidden" name="${_csrf.parameterName}"/>
                <button type="submit" class="btn-subtle theme-accent">Logout</button>
            </form>
        </div>

    <h1>List of Movies</h1>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Year</th>
                    <th>Director</th>

                        <th>Delete</th>
                        <th>Edit</th>

                </tr>
            </thead>
            <tbody>
            <tr th:each="movie: ${movies}">
                <td th:text="${movie.name}"></td>
                <td th:text="${movie.year}"></td>
                <td th:text="${movie.director}"></td>
                <td>
                    <form th:action="@{/admin/delete/{id}(id=${movie.id})}" method="post"
                          onsubmit="return confirm('Delete this movie?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-outline theme-accent">Delete</button>
                    </form>
                </td>
                <td>
                    <a th:href="@{/admin/editor/{id}(id=${movie.id})}" class="btn-outline theme-accent">
                         edit
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
            <a th:href="@{/admin/new}" class="theme-accent btn-solid btn-styled">
                add new movie
            </a>
        <a th:href="@{/admin/users}" class="theme-accent btn-solid btn-styled">
            View users
        </a>
    </div>
</body>
