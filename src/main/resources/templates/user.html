<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>

<body>
<div class="container">
    <div sec:authorize="isAuthenticated()" class="d-flex flex-row-reverse pb-3 mb-4">
        <div class="p-2 pb-3 mb-4">
            <span>
                User:
                <b><span sec:authentication="name"></span></b>
            </span>
        </div>
        <form th:action="@{/logout}"
              method="post"
              style="display:inline; margin-left:10px">
            <input type="hidden" name="${_csrf.parameterName}"/>
            <button type="submit" class="btn-subtle theme-accent">Logout</button>
        </form>
    </div>

<h1>User</h1>

<table class="table-striped">
    <thead>
    <tr>
        <th>Name</th>
        <th>Password</th>
        <th>Email</th>
        <th>Role</th>

        <th>Edit</th>

    </tr>
    </thead>
    <tbody>

    <tr th:each="user: ${user}">
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.roles}">
            <span th:each="role : ${user.roles}"
                                          class="badge bg-secondary me-1"
                                          th:text="${role.role}">
            </span></td>
        <td>

        </td>
        <td>
            <a th:href="@{/admin/users/editor/{id}(id=${user.id})}">
                edit
            </a>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/admin/users}" class="btn-outline theme-accent">
    Go back
</a>
</div>
</body>
