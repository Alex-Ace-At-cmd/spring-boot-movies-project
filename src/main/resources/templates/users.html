<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>

<body>
<div class="conteiner">

    <div sec:authorize="isAuthenticated()" class="d-flex flex-row-reverse pb-3 mb-4">
        <div class="p-2 pb-3 mb-4">
            <span>
                User:
                <b><span sec:authentication="name"></span></b>
            </span>
        </div>
        <form th:action="@{/logout}"
              method="post"
              style="display:inline; margin-left:10px">
            <input type="hidden" name="${_csrf.parameterName}"/>
            <button type="submit" class="btn-subtle theme-accent">Logout</button>
        </form>
    </div>

<h1>List of Users</h1>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>

        <th>Delete</th>
        <th>Edit</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="user: ${users}">
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td>
            <span th:each="role : ${user.roles}"
                class="badge bg-secondary me-1"
                th:text="${role.role}">
            </span>
        </td>
        <td>
            <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post"
                  onsubmit="return confirm('Delete this user?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-outline theme-accent">Delete</button>
            </form>
        </td>
        <td>
            <a th:href="@{/admin/users/editor/{id}(id=${user.id})}" class="btn-outline theme-accent">
                edit
            </a>
        </td>
    </tr>
    </tbody>
</table>
    <a th:href="@{/admin}" class="btn-outline theme-accent">
        Go back
    </a>
<a th:href="@{/admin/users/new}" class="btn-solid theme-accent">
    add new user
</a>
</div>
</body>
